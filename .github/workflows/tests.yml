name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Lint
        run: ruff check finishsim tests scripts

      - name: Test
        run: python -m pytest --cov=finishsim --cov-report=term-missing

      - name: Reproduce the study end to end
        run: python scripts/run_study.py
